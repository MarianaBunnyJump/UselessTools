<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="sans-serif">
  <rect width="375" height="812" fill="#FFF9F2"/>
  <text x="24" y="30" font-size="14" fill="#4A3B32">9:41</text>
  <text x="20" y="76" font-size="22" fill="#4A3B32">‹</text>
  <text x="146" y="76" font-size="18" font-weight="bold" fill="#4A3B32">文本批量替换</text>
  <!-- source text -->
  <rect x="24" y="98" width="327" height="110" rx="16" fill="#FFFFFF"/>
  <text x="44" y="130" font-size="14" fill="#4A3B32">第1章 项目排期：张三负责A模块，张三对接</text>
  <text x="44" y="154" font-size="14" fill="#4A3B32">设计。张三周三汇报。……</text>
  <text x="276" y="192" font-size="12" fill="#B8A99E">1,204 字</text>
  <!-- rules -->
  <text x="24" y="240" font-size="15" font-weight="bold" fill="#4A3B32">替换规则（按顺序执行）</text>
  <rect x="24" y="256" width="327" height="52" rx="14" fill="#FFFFFF"/>
  <rect x="40" y="270" width="110" height="26" rx="8" fill="#FFF9F2"/><text x="52" y="289" font-size="13" fill="#4A3B32">张三</text>
  <text x="158" y="289" font-size="13" fill="#C9A063">→</text>
  <rect x="174" y="270" width="110" height="26" rx="8" fill="#FFF9F2"/><text x="182" y="289" font-size="13" fill="#4A3B32">李四</text>
  <text x="308" y="289" font-size="14" fill="#E07856">✕</text>
  <rect x="24" y="316" width="327" height="52" rx="14" fill="#FFFFFF"/>
  <rect x="40" y="330" width="110" height="26" rx="8" fill="#FFF9F2"/><text x="48" y="349" font-size="13" fill="#4A3B32">A模块</text>
  <text x="158" y="349" font-size="13" fill="#C9A063">→</text>
  <rect x="174" y="330" width="110" height="26" rx="8" fill="#FFF9F2"/><text x="178" y="349" font-size="13" fill="#4A3B32">新版块</text>
  <text x="308" y="349" font-size="14" fill="#E07856">✕</text>
  <rect x="24" y="376" width="327" height="44" rx="14" fill="#FFFFFF" stroke="#B8A99E" stroke-dasharray="4 3"/>
  <text x="128" y="404" font-size="14" fill="#8D7B70">＋ 加一条规则</text>
  <!-- recipe save -->
  <rect x="24" y="436" width="327" height="60" rx="16" fill="#C9A063" opacity="0.12"/>
  <text x="44" y="460" font-size="14" font-weight="bold" fill="#C9A063">📦 存为配方</text>
  <text x="44" y="482" font-size="12" fill="#8D7B70">常用规则起个名字，下次一键套用（已存 3 个）</text>
  <!-- run -->
  <rect x="24" y="516" width="327" height="56" rx="28" fill="#FF8A80"/>
  <text x="150" y="550" font-size="17" font-weight="bold" fill="#FFFFFF">全部替换</text>
  <!-- result -->
  <rect x="24" y="592" width="327" height="130" rx="16" fill="#FFFFFF"/>
  <text x="44" y="620" font-size="13" fill="#C9A063">结果 · 替换 17 处</text>
  <text x="44" y="650" font-size="14" fill="#4A3B32">第1章 项目排期：<tspan fill="#E07856">李四</tspan>负责<tspan fill="#E07856">新版块</tspan>，</text>
  <text x="44" y="674" font-size="14" fill="#4A3B32"><tspan fill="#E07856">李四</tspan>对接设计。<tspan fill="#E07856">李四</tspan>周三汇报。……</text>
  <text x="44" y="704" font-size="13" fill="#8D7B70">📋 复制结果</text>
</svg>
