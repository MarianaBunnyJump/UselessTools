<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="sans-serif">
  <rect width="375" height="812" fill="#FFF9F2"/>
  <text x="24" y="30" font-size="14" fill="#4A3B32">9:41</text>
  <!-- nav -->
  <text x="20" y="76" font-size="22" fill="#4A3B32">‹</text>
  <text x="160" y="76" font-size="18" font-weight="bold" fill="#4A3B32">文言文陪读</text>
  <text x="340" y="76" font-size="16" fill="#C9A063">⭐</text>
  <!-- article head -->
  <text x="24" y="122" font-size="30" font-weight="bold" fill="#4A3B32">陋室铭</text>
  <text x="24" y="148" font-size="16" fill="#8D7B70">唐 · 刘禹锡　七年级上</text>
  <!-- tool chips -->
  <rect x="24" y="166" width="88" height="34" rx="17" fill="#FFFFFF" stroke="#C9A063"/>
  <text x="42" y="188" font-size="14" fill="#C9A063">背诵模式</text>
  <rect x="120" y="166" width="60" height="34" rx="17" fill="#FFFFFF"/>
  <text x="138" y="188" font-size="14" fill="#8D7B70">字号</text>
  <rect x="188" y="166" width="76" height="34" rx="17" fill="#FFFFFF"/>
  <text x="200" y="188" font-size="14" fill="#8D7B70">连播 1×</text>
  <!-- sentence block 1 -->
  <text x="40" y="238" font-size="11" fill="#B8A99E">shān bù zài gāo ， yǒu xiān zé míng 。</text>
  <text x="40" y="266" font-size="21" fill="#4A3B32">山不在高，有仙则名。</text>
  <!-- highlighted sentence (playing) -->
  <rect x="28" y="286" width="319" height="52" rx="14" fill="#C9A063" opacity="0.14"/>
  <rect x="28" y="286" width="319" height="52" rx="14" fill="none" stroke="#C9A063"/>
  <text x="40" y="304" font-size="11" fill="#C9A063">shuǐ bù zài shēn ， yǒu lóng zé líng 。</text>
  <text x="40" y="331" font-size="21" font-weight="bold" fill="#4A3B32">水不在深，有龙则<tspan fill="#E07856" text-decoration="underline">灵</tspan>。</text>
  <circle cx="212" cy="324" r="4" fill="#C9A063"/>
  <!-- note popover -->
  <rect x="196" y="346" width="151" height="58" rx="12" fill="#FFFFFF" stroke="#C9A063"/>
  <text x="208" y="368" font-size="13" font-weight="bold" fill="#C9A063">灵：灵验</text>
  <text x="208" y="390" font-size="12" fill="#8D7B70">名词作动词，出名</text>
  <!-- sentence block 2 -->
  <text x="40" y="446" font-size="11" fill="#B8A99E">sī shì lòu shì ， wéi wú dé xīn 。</text>
  <text x="40" y="474" font-size="21" fill="#4A3B32">斯是陋室，惟吾德馨。</text>
  <!-- sentence block 3 -->
  <text x="40" y="514" font-size="11" fill="#B8A99E">tái hén shàng lǜ ， cǎo sè rù lián qīng 。</text>
  <text x="40" y="542" font-size="21" fill="#4A3B32">苔痕上阶绿，草色入帘青。</text>
  <!-- 局长批注 -->
  <rect x="24" y="580" width="327" height="64" rx="16" fill="#5B7A9D" opacity="0.1"/>
  <text x="40" y="606" font-size="13" font-weight="bold" fill="#5B7A9D">📌 局长批注</text>
  <text x="40" y="628" font-size="13" fill="#5B7A9D">房子小不要紧，朋友多才是真的。</text>
  <!-- player bar -->
  <rect x="0" y="700" width="375" height="72" fill="#FFFFFF"/>
  <line x1="0" y1="700" x2="375" y2="700" stroke="#4A3B32" stroke-opacity="0.08"/>
  <text x="28" y="742" font-size="15" fill="#4A3B32">◀</text>
  <circle cx="150" cy="736" r="24" fill="#C9A063"/>
  <text x="142" y="743" font-size="18" fill="#FFFFFF">▶</text>
  <text x="196" y="742" font-size="15" fill="#4A3B32">▶|</text>
  <text x="252" y="742" font-size="14" fill="#8D7B70">已读 2 / 9 句</text>
</svg>
