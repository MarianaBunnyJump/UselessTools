<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="sans-serif">
  <rect width="375" height="812" fill="#FFF9F2"/>
  <text x="24" y="30" font-size="14" fill="#4A3B32">9:41</text>
  <text x="20" y="76" font-size="22" fill="#4A3B32">‹</text>
  <text x="158" y="76" font-size="18" font-weight="bold" fill="#4A3B32">图片小工具箱</text>
  <!-- photo frame with crop -->
  <rect x="24" y="98" width="327" height="260" rx="20" fill="#FFFFFF"/>
  <g clip-path="url(#f)">
    <defs><clipPath id="f"><rect x="64" y="118" width="247" height="200" rx="12"/></clipPath></defs>
    <rect x="64" y="118" width="247" height="200" rx="12" fill="#B3E5FC"/>
    <circle cx="280" cy="160" r="22" fill="#FFF176"/>
    <path d="M 64 260 Q 140 200 200 260 T 311 250 L 311 318 L 64 318 Z" fill="#81C784"/>
  </g>
  <!-- crop handles -->
  <rect x="64" y="118" width="247" height="200" fill="none" stroke="#FF8A80" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="56" y="110" width="16" height="16" fill="#FF8A80"/><rect x="303" y="110" width="16" height="16" fill="#FF8A80"/>
  <rect x="56" y="310" width="16" height="16" fill="#FF8A80"/><rect x="303" y="310" width="16" height="16" fill="#FF8A80"/>
  <text x="150" y="380" font-size="13" fill="#8D7B70">拖四角裁剪 · 比例 3:4</text>
  <!-- tool chips -->
  <g>
    <rect x="24" y="404" width="76" height="44" rx="22" fill="#FFFFFF"/><text x="46" y="432" font-size="14">🔄</text>
    <rect x="108" y="404" width="76" height="44" rx="22" fill="#FFFFFF"/><text x="130" y="432" font-size="14">📐</text>
    <rect x="192" y="404" width="76" height="44" rx="22" fill="#FFFFFF"/><text x="214" y="432" font-size="14">✨</text>
    <rect x="276" y="404" width="76" height="44" rx="22" fill="#FFFFFF"/><text x="298" y="432" font-size="14">🔤</text>
  </g>
  <text x="36" y="426" font-size="11" fill="#8D7B70">旋转</text>
  <text x="120" y="426" font-size="11" fill="#8D7B70">裁比例</text>
  <text x="204" y="426" font-size="11" fill="#8D7B70">滤镜</text>
  <text x="288" y="426" font-size="11" fill="#8D7B70">贴字</text>
  <!-- filter strip -->
  <rect x="24" y="464" width="327" height="86" rx="16" fill="#FFFFFF"/>
  <g>
    <rect x="40" y="478" width="56" height="56" rx="12" fill="#C9A063" opacity="0.2"/><text x="54" y="512" font-size="11" fill="#8D7B70">原片</text>
    <rect x="106" y="478" width="56" height="56" rx="12" fill="#FFD54F" opacity="0.3"/><text x="116" y="512" font-size="11" fill="#8D7B70">暖阳</text>
    <rect x="172" y="478" width="56" height="56" rx="12" fill="#81D4FA" opacity="0.35"/><text x="176" y="512" font-size="11" fill="#8D7B70">冷调</text>
    <rect x="238" y="478" width="56" height="56" rx="12" fill="#4A3B32" opacity="0.25"/><text x="248" y="512" font-size="11" fill="#8D7B70">复古</text>
  </g>
  <!-- privacy export -->
  <rect x="24" y="572" width="327" height="76" rx="18" fill="#5B7A9D" opacity="0.1"/>
  <text x="44" y="600" font-size="14" font-weight="bold" fill="#5B7A9D">🛡 隐私导出（推荐）</text>
  <text x="44" y="626" font-size="12" fill="#5B7A9D">重新编码图片，抹掉拍摄位置与设备信息再保存</text>
  <rect x="24" y="664" width="327" height="56" rx="28" fill="#FF8A80"/>
  <text x="132" y="698" font-size="17" font-weight="bold" fill="#FFFFFF">保存处理结果</text>
</svg>
