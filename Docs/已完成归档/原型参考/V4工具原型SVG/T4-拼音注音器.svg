<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="sans-serif">
  <rect width="375" height="812" fill="#FFF9F2"/>
  <text x="24" y="30" font-size="14" fill="#4A3B32">9:41</text>
  <text x="20" y="76" font-size="22" fill="#4A3B32">‹</text>
  <text x="150" y="76" font-size="18" font-weight="bold" fill="#4A3B32">拼音注音器</text>
  <!-- input card -->
  <rect x="24" y="98" width="327" height="120" rx="16" fill="#FFFFFF"/>
  <text x="44" y="134" font-size="17" fill="#4A3B32">写点什么，我来注音：</text>
  <rect x="44" y="150" width="287" height="44" rx="12" fill="#FFF9F2"/>
  <text x="60" y="178" font-size="16" fill="#4A3B32">重湖叠巘清嘉</text>
  <!-- output: annotated -->
  <rect x="24" y="236" width="327" height="230" rx="16" fill="#FFFFFF"/>
  <text x="44" y="266" font-size="14" fill="#C9A063">逐字注音</text>
  <g text-anchor="middle">
    <text x="76" y="306" font-size="12" fill="#8D7B70">chóng</text><text x="76" y="338" font-size="22" fill="#4A3B32">重</text>
    <text x="126" y="306" font-size="12" fill="#8D7B70">hú</text><text x="126" y="338" font-size="22" fill="#4A3B32">湖</text>
    <text x="176" y="306" font-size="12" fill="#8D7B70">dié</text><text x="176" y="338" font-size="22" fill="#4A3B32">叠</text>
    <text x="226" y="306" font-size="12" fill="#8D7B70">yǎn</text><text x="226" y="338" font-size="22" fill="#4A3B32" text-decoration="underline">巘</text>
    <circle cx="226" cy="298" r="2" fill="#E07856"/>
    <text x="276" y="306" font-size="12" fill="#8D7B70">qīng</text><text x="276" y="338" font-size="22" fill="#4A3B32">清</text>
    <text x="76" y="396" font-size="12" fill="#8D7B70">jiā</text><text x="76" y="428" font-size="22" fill="#4A3B32">嘉</text>
  </g>
  <!-- polyphone fix -->
  <rect x="44" y="360" width="287" height="44" rx="12" fill="#E07856" opacity="0.1"/>
  <text x="60" y="388" font-size="13" fill="#E07856">巘 yǎn：山峰（多音候选 dǎn？点字可改）</text>
  <!-- actions -->
  <rect x="24" y="486" width="155" height="52" rx="26" fill="#FF8A80"/>
  <text x="52" y="518" font-size="16" font-weight="bold" fill="#FFFFFF">复制注音文</text>
  <rect x="196" y="486" width="155" height="52" rx="26" fill="#FFFFFF"/>
  <text x="224" y="518" font-size="16" fill="#4A3B32">导出图片</text>
  <!-- formats -->
  <text x="24" y="580" font-size="15" font-weight="bold" fill="#4A3B32">导出版式</text>
  <rect x="24" y="598" width="100" height="64" rx="14" fill="#C9A063"/>
  <text x="46" y="636" font-size="14" fill="#FFFFFF">字上拼下</text>
  <rect x="136" y="598" width="100" height="64" rx="14" fill="#FFFFFF"/>
  <text x="150" y="630" font-size="13" fill="#8D7B70">行间注音</text>
  <text x="140" y="650" font-size="12" fill="#B8A99E">（一段一行）</text>
  <rect x="248" y="598" width="100" height="64" rx="14" fill="#FFFFFF"/>
  <text x="266" y="630" font-size="13" fill="#8D7B70">纯拼音</text>
  <text x="258" y="650" font-size="12" fill="#B8A99E">（只有拼音）</text>
  <text x="66" y="716" font-size="13" fill="#B8A99E">多音字长按改读音，选择会记住，下次直接用</text>
</svg>
