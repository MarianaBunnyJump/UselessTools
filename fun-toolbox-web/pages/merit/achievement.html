<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>功德成就</title>
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/animations.css">
  <style>
    .achievement-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .achievement-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; padding: 18px 8px;
      background: var(--ft-card-bg); border: 1px solid var(--ft-card-border);
      border-radius: var(--ft-radius-lg); text-align: center;
      transition: transform 0.2s ease;
    }
    .achievement-card.locked { opacity: 0.55; filter: grayscale(0.8); }
    .achievement-card:not(.locked) { box-shadow: 0 6px 16px -6px rgba(255,152,0,0.2); }
    .achievement-card .icon { font-size: 34px; }
    .achievement-card .name { font-size: 14px; font-weight: 700; color: var(--ft-text-primary); }
    .achievement-card .desc { font-size: 11px; color: var(--ft-text-tertiary); line-height: 1.4; }
    .achievement-card .lock { font-size: 16px; margin-top: 2px; }
    .achievement-card:not(.locked) .lock { display: none; }
    .stats-line { text-align: center; margin-bottom: 16px; font-size: 14px; color: var(--ft-text-secondary); }
    .stats-line strong { color: var(--ft-primary); }
  </style>
</head>
<body>
  <div class="app-shell ft-page">
    <nav class="ft-nav">
      <a class="ft-back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        返回
      </a>
      <div class="ft-title">功德成就</div>
      <div class="ft-nav-spacer"></div>
    </nav>

    <main>
      <div class="stats-line">已解锁 <strong id="unlockedCount">0</strong> / <span id="totalCount">0</span> 个成就</div>
      <section class="achievement-grid" id="achievementGrid"></section>
    </main>
  </div>

  <script src="../../js/storage.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/theme.js"></script>
  <script>
    (function () {
      FT.theme.init();
      const grid = document.getElementById('achievementGrid');
      const unlockedSet = new Set(FT.storage.get('merit_achievements', []));
      const total = FT.data.achievements.length;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('unlockedCount').textContent = unlockedSet.size;

      FT.data.achievements.forEach((a, idx) => {
        const isLocked = !unlockedSet.has(a.id);
        const card = document.createElement('div');
        card.className = 'achievement-card' + (isLocked ? ' locked' : '');
        card.style.animationDelay = (idx * 0.05) + 's';
        card.innerHTML = `
          <div class="icon">${a.icon}</div>
          <div class="name">${a.name}</div>
          <div class="desc">${a.desc}</div>
          ${isLocked ? '<div class="lock">🔒</div>' : ''}
        `;
        grid.appendChild(card);
      });
    })();
  </script>
</body>
</html>
